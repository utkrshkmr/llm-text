<text x="445.0" y="141.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#82c984" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">elements of K</text>
<text x="10.0" y="190.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#dbdbdb" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Kept in BF16/FP32: embedding, output head, MoE gating, normalisation, attention; FP32 master weights and</text>
<text x="10.0" y="207.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#dbdbdb" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">weight gradients; BF16 AdamW moments. FP8 for Fprop, Dgrad and Wgrad GEMMs; activations cached and dispatched in FP8</text>
<text x="10.0" y="224.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#dbdbdb" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">(attention-output Linear inputs in a custom E5M6, power-of-two scales for the cached activations of certain layers).</text>
<text x="10.0" y="252.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#9f9f9f" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Reported: relative loss gap to BF16 below 0.25% (DeepSeek-AI, 2024). Our 14-bit accumulator model: max relative accumulation</text>
<text x="10.0" y="269.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#9f9f9f" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">error 1.1% at K = 4096 without promotion, 0.05% with promotion every 128 (the paper reports nearly 2% without).</text>
</svg>
