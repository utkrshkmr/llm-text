<text x="172.0" y="187.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#dbdbdb" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">x_i = g * s_b * p_i,  s_b in E4M3 holds amax_b / (6 g),  g = amax / (6 * 448)</text>
<text x="10.0" y="225.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#9f9f9f" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">A power-of-two scale (E8M0) can leave the block's largest element up to one binade below the top of the grid;</text>
<text x="10.0" y="242.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#9f9f9f" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">an E4M3 scale has 3 fraction bits, so it maps amax_b to within about 6% of 6 for every block.</text>
