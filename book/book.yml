title: Big Book of LLMs
subtitle: A Systems-First Textbook
# Publication: only the first published_parts parts (and the listed appendix letters) are written to the
# website; the rest are built for numbering and cross-references but stay hidden until they are finished.
# Raise published_parts as each part passes its stage. `build_site.py --all` previews everything.
published_parts: 1
published_appendices: F H
front:
  - frontmatter/preface.md
  - frontmatter/roadmap.md
# Every part ends with its capstone projects (proj_*): research-grade work that uses only material from that
# part and the parts before it.
